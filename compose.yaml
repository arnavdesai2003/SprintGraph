services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: sprintgraph
      POSTGRES_USER: sprintgraph
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: [CMD-SHELL, 'pg_isready -U sprintgraph -d sprintgraph']
      interval: 5s
      timeout: 3s
      retries: 20
  migrate:
    build: ./backend
    env_file: .env
    environment:
      DATABASE_URL: postgresql+psycopg://sprintgraph:${POSTGRES_PASSWORD}@db:5432/sprintgraph
    command: [alembic, upgrade, head]
    depends_on:
      db:
        condition: service_healthy
  seed:
    build: ./backend
    env_file: .env
    environment:
      DATABASE_URL: postgresql+psycopg://sprintgraph:${POSTGRES_PASSWORD}@db:5432/sprintgraph
    command: [python, -m, app.seed]
    profiles: [demo]
    depends_on:
      migrate:
        condition: service_completed_successfully
  backend:
    build: ./backend
    env_file: .env
    environment:
      DATABASE_URL: postgresql+psycopg://sprintgraph:${POSTGRES_PASSWORD}@db:5432/sprintgraph
    ports: ['127.0.0.1:8000:8000']
    depends_on:
      migrate:
        condition: service_completed_successfully
    healthcheck:
      test: [CMD, python, -c, "import urllib.request; urllib.request.urlopen('http://localhost:8000/ready')"]
      interval: 10s
      timeout: 3s
      retries: 10
  worker:
    build: ./backend
    env_file: .env
    environment:
      DATABASE_URL: postgresql+psycopg://sprintgraph:${POSTGRES_PASSWORD}@db:5432/sprintgraph
    command: [python, -m, app.worker]
    depends_on:
      backend:
        condition: service_healthy
    restart: unless-stopped
  frontend:
    build: ./frontend
    ports: ['127.0.0.1:3000:3000']
    depends_on:
      backend:
        condition: service_healthy
    healthcheck:
      test: [CMD, node, -e, "fetch('http://localhost:3000').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 10s
      timeout: 3s
      retries: 10
  e2e:
    build: ./e2e
    profiles: [test]
    network_mode: service:frontend
    environment:
      DEMO_PASSWORD: ${DEMO_PASSWORD:?Set DEMO_PASSWORD}
    volumes:
      - ./artifacts/e2e:/artifacts
    depends_on:
      frontend:
        condition: service_healthy
      worker:
        condition: service_started
      seed:
        condition: service_completed_successfully
  test-db:
    image: postgres:17-alpine
    profiles: [database-test]
    environment:
      POSTGRES_DB: sprintgraph_test
      POSTGRES_USER: sprintgraph
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD}
    healthcheck:
      test: [CMD-SHELL, 'pg_isready -U sprintgraph -d sprintgraph_test']
      interval: 3s
      timeout: 3s
      retries: 20
  backend-tests:
    build: ./backend
    profiles: [database-test]
    env_file: .env
    environment:
      SPRINTGRAPH_TEST_DATABASE_URL: postgresql+psycopg://sprintgraph:${POSTGRES_PASSWORD}@test-db:5432/sprintgraph_test
    command: [sh, -c, 'pytest -q && ruff check .']
    depends_on:
      test-db:
        condition: service_healthy
volumes:
  postgres_data:
