[project]
name = "sprintgraph"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = ["fastapi>=0.115,<1", "uvicorn[standard]>=0.30,<1", "sqlalchemy>=2,<3", "psycopg[binary]>=3.2,<4", "alembic>=1.14,<2", "pydantic-settings>=2,<3", "langgraph>=0.3,<2", "httpx>=0.28,<1", "PyJWT>=2.9,<3", "pwdlib[argon2]>=0.2,<1"]
[project.optional-dependencies]
dev = ["pytest>=8,<10", "ruff>=0.9,<1"]
[tool.ruff]
line-length = 110
[tool.ruff.lint]
select = ["E4", "E7", "E9", "F"]
[tool.pytest.ini_options]
pythonpath = ["."]
[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"
[tool.setuptools.packages.find]
include = ["app*"]
